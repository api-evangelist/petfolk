aid: petfolk
name: Petfolk
description: >-
  Petfolk is a Charlotte, North Carolina based veterinary care company that operates a network of
  modern, company-owned pet care centers across the US Southeast and Texas, paired with a consumer
  mobile app. Founded and led by veterinarian Dr. Audrey Wystrach, Petfolk provides primary and
  wellness care, sick and urgent care, dentistry, surgery, spay and neuter, vaccinations and
  diagnostics for dogs and cats, delivered under a "gentle handling" clinical model with
  seven-day-a-week hours and published, transparent pricing. The Petfolk iOS and Android app lets
  pet parents book in-person or virtual appointments, message their care team around the clock,
  request medications and access their pet's medical records; a paid PetfolkCare membership layers
  on 24/7 veterinary support and per-visit savings. The company raised a $40M Series B in October
  2023 led by Movendo Capital, with White Star Capital and Idea Farm Ventures participating.
  Petfolk is a consumer veterinary services operator, not an API provider: as of this profiling
  pass it publishes no public developer portal, API documentation, OpenAPI/GraphQL contract, SDKs
  or MCP server. It does publish a hand-authored llms.txt at the site root, which is the company's
  only machine-readable, agent-facing surface.
